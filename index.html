<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Nothing leaves this device yet, so connect-src is 'self' and stays that way
     until sync lands — at which point Firestore's hosts and the Worker get
     added explicitly, and nothing else ever does. script-src 'self' with no
     'unsafe-inline' is why the service-worker registration lives in app.js:
     there are no inline scripts, so an injected one cannot execute. -->
<!-- script-src names gstatic because the Firebase SDK loads from there and
     nowhere else; there is still no 'unsafe-inline', so an injected script
     cannot execute. connect-src is an allowlist of exactly the Google endpoints
     Firestore and anonymous auth use — if a stolen value ever did end up in the
     page, this is what stops it being sent anywhere. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://www.gstatic.com;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  connect-src 'self'
              https://firestore.googleapis.com
              https://*.workers.dev
              https://securetoken.googleapis.com
              https://identitytoolkit.googleapis.com
              https://www.googleapis.com;
  frame-src https://*.firebaseapp.com;
  form-action 'none';
  base-uri 'none';
  object-src 'none'">
<!-- No user-scalable=no: blocking pinch-zoom fails WCAG 1.4.4, and this app is
     built for people who may want to zoom. viewport-fit=cover is what the
     edge-to-edge layout needs. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scout — puppy raising, shared</title>
<meta name="description" content="A shared puppy log for the whole household. Toilet schedule worked out from her age, sleep and biting patterns, and what to work on next — without the streaks.">
<meta name="theme-color" content="#f6f6f3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scout">
<link rel="stylesheet" href="style.css?v=16">
</head>
